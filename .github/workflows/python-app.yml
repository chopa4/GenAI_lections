name: Python application

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests coverage coverage-badge

      - name: Run tests with coverage
        working-directory: 3_1_LLM_agent
        run: |
          python -m coverage run -m pytest tests -v
          python -m coverage report

      - name: Generate coverage badge
        working-directory: 3_1_LLM_agent
        run: |
          coverage-badge -o coverage.svg

      - name: Commit coverage badge
        if: github.actor != 'github-actions[bot]'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 3_1_LLM_agent/coverage.svg
          git diff --cached --quiet || git commit -m "Update coverage badge"
          git push