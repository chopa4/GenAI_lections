name: Python application

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests coverage

      - name: Run tests with coverage
        working-directory: 3_1_LLM_agent
        run: |
          python -m coverage run -m pytest tests -v
          python -m coverage report

      - name: Generate coverage badge
        working-directory: 3_1_LLM_agent
        run: |
          coverage=$(python -m coverage report | tail -1 | awk '{print $4}' | tr -d '%')
          echo "Coverage: $coverage%"
          cat > coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="120" height="20">
            <rect width="120" height="20" fill="#555"/>
            <rect x="60" width="60" height="20" fill="#4c1"/>
            <text x="30" y="14" fill="white" text-anchor="middle" font-family="Verdana" font-size="11">coverage</text>
            <text x="90" y="14" fill="white" text-anchor="middle" font-family="Verdana" font-size="11">${coverage}%</text>
          </svg>
          EOF

      - name: Commit coverage badge
        if: github.actor != 'github-actions[bot]'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 3_1_LLM_agent/coverage.svg
          git diff --cached --quiet || git commit -m "Update coverage badge"
          git push